 {id:'P4.3',n:'Extracción a mano y automática + pedidos',e:'hecha',inc:'Nodos (2 donantes, incubadora, toma de agua), mantener clic para extraer, extractores Mk1 sobre nodo, terminal de pedidos de reactivo con camión al muelle de carga, muelle de envío que vende vacunas, inventario de 40, consejo del momento',hc:'Se juega sin explicaciones',dep:'P4.1',ver:'Prueba de ratón: extracción a mano, extractor automático, pedido desde el terminal. Consejos guiados en el panel de objetivo. Pendiente de la prueba de Edu',c:'feat: puerta 4 jugable'},
 {id:'P4.4',n:'Biorreactor y cámara de cepa',e:'hecha',inc:'Seis mutaciones N1 elegibles en el panel del biorreactor, vial con su mutación, la cámara registra y desecha repetidas, el virus se libera con la primera y crecen propagación y cura (HUD y monitor del mundo)',hc:'Primera mutación en 4–6 min',dep:'P4.1',ver:'Prueba de ratón: primera mutación, repetida desechada sin atasco (B4), segunda mutación cambiando receta. Con juego perfecto llega en ~1 min; a medir con la prueba de Edu',c:'feat: puerta 4 jugable'},
 {id:'P4.5',n:'Prueba de Edu: 15 minutos',e:'hecha',inc:'Build Windows y web en entregas',hc:'Edu quiere seguir automatizando',dep:'P4.1–P4.4',ver:'Edu se bloqueó: no sabía dónde poner la extracción, que había que hacer clic a las máquinas, qué hacer con el plasma; sin dinero para el biorreactor; el inventario y la venta no se entendían. Diagnóstico: el inicio no enseña nada y la mecánica a mano (clic en máquinas, inventario) no se ve en el mundo. Se rehace el inicio (P4.6–P4.13)',c:''},{id:'P4.6',n:'Diseño del nuevo inicio',e:'hecha',inc:'feat: nuevo inicio',hc:'Documento de diseño y hoja de ruta actualizados',dep:'P4.5',ver:'Documento de diseño (sección «Revisión tras la primera prueba») y decisiones actualizados',c:''},{id:'P4.7',n:'El científico',e:'hecha',inc:'feat: nuevo inicio',hc:'Prueba con ratón y teclado reales',dep:'P4.6',ver:'Prueba con ratón y teclado reales (-- --prueba_raton) 20/20, recorriendo el tutorial hasta automatizar la camilla con un zombi. El científico va andando por casillas libres, lleva hasta 4 en las manos (se ven) y la cámara le sigue',c:''},{id:'P4.8',n:'Estaciones de extracción',e:'hecha',inc:'feat: nuevo inicio',hc:'Las tres materias primas se consiguen así y se automatizan',dep:'P4.7',ver:'Prueba con ratón y teclado reales (-- --prueba_raton) 20/20, recorriendo el tutorial hasta automatizar la camilla con un zombi. Camilla con pacientes que entran por la puerta, se tumban y se van; incubadora con cultivo creciendo; toma de agua llenándose. Piezas provisionales',c:''},{id:'P4.9',n:'Máquinas automáticas y bocas visibles',e:'hecha',inc:'feat: nuevo inicio',hc:'Edu sabe dónde conectar sin leer nada',dep:'P4.6',ver:'Prueba con ratón y teclado reales (-- --prueba_raton) 20/20, recorriendo el tutorial hasta automatizar la camilla con un zombi. Flechas verdes (entra) y naranjas (sale) en el fantasma y en todo lo construido mientras construyes; sin inventario; devolución del 100 %',c:''},{id:'P4.10',n:'Economía y venta',e:'hecha',inc:'feat: nuevo inicio',hc:'Nunca te quedas sin dinero sin salida',dep:'P4.6',ver:'Muelle de envío con panel de precios; Dirección paga los hitos (500/400/1.000 €) y 300 € con el correo del biorreactor; la primera cadena cuesta 1.000 € = dinero inicial',c:''},{id:'P4.11',n:'Zombis trabajadores',e:'hecha',inc:'feat: nuevo inicio',hc:'Una estación pasa de manual a automática con un zombi',dep:'P4.8',ver:'Prueba con ratón y teclado reales (-- --prueba_raton) 20/20, recorriendo el tutorial hasta automatizar la camilla con un zombi. Tras liberar el virus llega un zombi cada 40 s a la puerta; se asigna desde el panel de una estación con máquina',c:''},{id:'P4.12',n:'Tutorial con historia',e:'hecha',inc:'feat: nuevo inicio',hc:'Edu llega a la primera mutación sin preguntar nada',dep:'P4.7–P4.10',ver:'Seis correos de Dirección (Proyecto Reinicio) y 12 pasos con flecha amarilla sobre el objetivo; el juego se pausa al leer',c:''},{id:'P4.13',n:'Segunda prueba de Edu',e:'hecha',inc:'feat: nuevo inicio',hc:'Edu quiere seguir automatizando',dep:'P4.6–P4.12',ver:'Hecha: sus comentarios se convirtieron en la versión 1.0 (V1.x)',c:''},
 {id:'P4.14',n:'Arreglos tras la segunda prueba',e:'hecha',inc:'Fallo de la camilla bloqueada al llevar otra cosa en las manos; clic solo abre el panel; llevar cosas arrastrando desde las manos o desde la salida de una máquina; botones Sacar sangre / Recoger / Tirar; ficha al pasar el puntero (qué es y qué hace)',hc:'Prueba con ratón real',dep:'P4.13',ver:'Prueba con ratón y teclado reales 25/25, con arrastre real hasta la centrífuga y la ficha flotante. Captura p414_ficha.png',c:'fix: manos ocupadas, arrastrar y fichas'},
 {id:'P4.15',n:'Propuesta 1.0: bucle incremental, recursos y máquinas con bocas',e:'hecha',inc:'Estudio de Factorio, Alchemy Factory, Endfield, Shapez 2 e incrementales; arco de la jugada de la jeringa a la granja de humanos; recursos (humanos, sangre, suero, dinero, energía, espacio, zombis); reglas de máquinas con bocas físicas por ingrediente y ritmos redondos',hc:'Edu aprueba la propuesta',dep:'P4.14',ver:'docs/propuesta_1_0.md, pendiente del visto bueno de Edu',c:''},
 {id:'V1.1',n:'Arreglos de la tercera prueba',e:'hecho',inc:'feat: bloque 1 de la 1.0',hc:'Bot y prueba de ratón',dep:'',ver:'B6–B10 arreglados; anuncios grandes en mutación, hito, parcela y fase. Prueba de ratón 28 ok (repetida → REPETIDA, cambio de receta conserva la tolva, quitar devuelve contenido)',c:''},
 {id:'V1.2',n:'Mochila y manos al estilo Factorio',e:'hecho',inc:'feat: bloque 1 de la 1.0',hc:'Edu: «ya no es asqueroso»',dep:'V1.1',ver:'Mochila 12 casillas, pilas de 20, mano visible, clic usa, Mayús+clic todo, F tira, arrastrar entre casillas y a máquinas; clic derecho abre panel. Pendiente de que Edu la pruebe',c:''},
 {id:'V1.3',n:'LISA y la historia propia',e:'hecho',inc:'feat: bloque 1 de la 1.0',hc:'Tutorial hasta la primera venta sin dudas',dep:'V1.2',ver:'Correos y anuncios de LISA reescritos; sin Dirección',c:''},
 {id:'V1.4',n:'Bocas físicas y recetas redondas',e:'hecho',inc:'feat: bloque 1 de la 1.0',hc:'Bot: cadenas sin atascos',dep:'V1.1',ver:'Bocas por ingrediente con icono de filtro (mezcladora reactivo/agua, envasadora vial/suero); las vacunas heredan la mutación; bot comprueba boca equivocada',c:''},
 {id:'V1.5',n:'Hub de vacunas y ascensor de pedidos (ascensor sustituido en V1.14)',e:'hecho',inc:'feat: bloque 1 de la 1.0',hc:'Se ve salir cada envío',dep:'V1.4',ver:'Hub 2×2 con furgoneta cada 8 cajas; propagación solo por vacunas vendidas; ascensor 2×2 con 3 fases y cápsula que sube; candados en la barra. Bot: fase 1 y hub probados',c:''},
 {id:'V1.6',n:'Parcelas 8×8',e:'hecho',inc:'feat: bloque 1 de la 1.0',hc:'Prueba de ratón',dep:'V1.5',ver:'Sala 48×32 en 6×4 parcelas; 4 iniciales, compra adyacente, precio ×1,6, bordes en fase 2; poste «se vende». Prueba de ratón compra una',c:''},
 {id:'V1.7',n:'Etapa 0: la jeringa',e:'revision',inc:'feat: V1.7–V1.9',hc:'Edu aprueba GIF',dep:'V1.2',ver:'Camilla nueva modelada (somier, ruedas, gotero, monitor con electro vivo, bandeja con tubos, contenedor de agujas). Extracción a mano por fases: torniquete, algodón, aguja destapada, pinchazo con respingo y gota, tubo que se llena, tirita; el paciente se incorpora mareado y se va tambaleándose. Brazo extractor con IK en modo máquina. GIF enviado a Edu (v17_extraccion.gif); falta su aprobado',c:''},
 {id:'V1.8',n:'Etapas 1–2: taller y zombis',e:'hecho',inc:'feat: V1.7–V1.9',hc:'Bot de partida',dep:'V1.4',ver:'Sala de espera (4 asientos con pacientes sentados), cola en la puerta, campañas (bocadillo ×2, análisis ×3, contrato +50 %), red de 20 kW con generador diésel (+40) y biogás de sangre (+150); si falta energía todo va más lento y avisa. Bot: 10 comprobaciones',c:''},
 {id:'V1.9',n:'Tuberías y cápsulas',e:'hecho',inc:'feat: V1.7–V1.9',hc:'Bot',dep:'V1.8',ver:'Tuberías rectas y codos con mirilla de sangre que corre, depósito de 200 l, cápsula de donante (1 l/s, suero cada 20 s), centrífuga industrial 2×2. Bot: cápsula → tubería → centrífuga → plasma',c:''},
 {id:'V1.10',n:'Granja de humanos y final',e:'hecho',inc:'feat: iconos nuevos, paneles arreglados, material de publicación y equilibrado del mundo',hc:'Partida completa en el bot',dep:'V1.14',ver:'Mundo con 12 regiones, destino de vacunas en el hub, contagio por cepa y viajes, zombis desde el mordisco, cura de los países ricos, victoria al 90 % y derrota. Equilibrado con tools/balance_mundo.py: normal ~7,5 h (cura ~78 %), lento pierde, rápido ~6 h. Granja de humanos de 4 cápsulas',c:''},
 {id:'V1.11',n:'Arte final y pulido',e:'sust',inc:'feat: iconos nuevos, paneles arreglados, material de publicación y equilibrado del mundo',hc:'Barra de calidad',dep:'V1.2–V1.10',ver:'Sustituida por el rediseño R (10-nov). Hecho: sonido y música sintetizados, guardado automático con menú de continuar, todas las piezas modeladas, 48 iconos renderizados, textos ES/EN. Falta para cerrar: que los objetos se vean entrar en las bocas de las máquinas (ahora llegan al borde), aprobado de Edu del GIF de extracción y de la lámina de piezas',c:''},
 {id:'V1.13',n:'Cadenas con profundidad',e:'hecho',inc:'feat: cadenas con profundidad, sala de cepas y mundo',hc:'Bot: cada producto tiene uso y varias máquinas trabajan el mismo material',dep:'V1.9',ver:'Recetas elegibles que fabrican sin parar. Sangre → plasma, hematíes o plaquetas; cultivo → ADN o ARN; mezcladora → suero o medio de cultivo; biorreactor → viriones o vectores; sintetizador (proteína), destilador (neurotoxina), impresora molecular (cápside), fusionador 3×3 (núcleo). 5 objetos y 4 máquinas nuevas modeladas. Bot: cadena profunda de vacunas',c:''},
 {id:'V1.14',n:'Sala de cepas (sustituye ascensor y cámara de cepa)',e:'hecho',inc:'feat: cadenas con profundidad, sala de cepas y mundo',hc:'Prueba de ratón y bot completan el árbol',dep:'V1.13',ver:'Sala de cepas 4×3 (cámara con la cepa viva, mesa de ingeniería genética con pantalla viva del árbol, mamparas). Árbol tipo Plague Inc de 24 mejoras (transmisión, síntomas, resistencias) con lotes que piden, efectos sobre la cepa y desbloqueos; premio de LISA por nivel. Ascensor y cámara de un solo uso fuera. Prueba de ratón completa',c:''},
 {id:'V1.15',n:'Paneles sin objetos fantasma',e:'hecho',inc:'La casilla del producto de camillas y estaciones sale vacía si no hay nada hecho (ahora enseña el icono atenuado como si hubiera 1)',hc:'Prueba de ratón con el panel vacío',dep:'',ver:'Hecho: la casilla del producto sale vacía hasta que hay algo hecho; la receta sigue enseñando lo que pide. Prueba de ratón OK',c:'53bf303'},
 {id:'V1.16',n:'Científico tranquilo al extraer',e:'hecho',inc:'Pose propia mientras pincha (inclinado sobre el brazo, manos quietas que acompañan la aguja) en vez de la animación de interactuar en bucle',hc:'GIF',dep:'',ver:'Hecho: pose propia «extraer» (inclinado, manos quietas siguiendo la aguja con IK) mientras dura la extracción; GIF extraccion2.gif enviado a Edu',c:'53bf303'},
 {id:'V1.17',n:'Sala de cepas de verdad y árbol incremental',e:'sust',inc:'Sala con paredes y puerta donde entra el científico; panel de árbol en red (nodos que se revelan al desbloquear, como un incremental), sin listas; tras entregar el lote, la síntesis de la cepa lleva tiempo: el científico trabaja en la mesa o, más adelante, una máquina sintetizadora animada lo hace sola',hc:'Edu: «ahora sí»',dep:'',ver:'Sustituida por el rediseño R (10-nov). Hecho, esperando a Edu: sala 7×6 con paredes modeladas (estanterías, nevera, campana, armarios), puerta y buzón para cinta; cámara con la cepa viva y mesa con pantalla. Árbol en red tipo incremental: 24 nodos en abanico por rama que se bifurcan y se vuelven a juntar, ocultos/candado/libre/en curso/hecho, panel lateral con lo que pide y lo que desbloquea. Tras entregar, la síntesis tarda (20–110 s): el científico trabaja en la mesa; con Náuseas se desbloquea el robot que sintetiza solo. Bot y prueba de ratón OK',c:'53bf303 · 46daf83'},
 {id:'V1.18',n:'Tutorial que no da pereza',e:'sust',inc:'Sin correos largos que paran el juego: LISA en un bocadillo pequeño de una o dos frases, objetivo siempre visible, el botón o la pieza que toca resaltados y opción de saltarlo',hc:'Edu lo sigue sin saltárselo',dep:'V1.17',ver:'Sustituida por el rediseño R (10-nov). Hecho, esperando a Edu: LISA en bocadillo de 1–2 frases que no para el juego (se cierra sola a los 14 s), objetivo siempre visible, la pieza o botón que toca resaltado y botón de saltar. Prueba de ratón OK',c:'53bf303'},
 {id:'V1.19',n:'Cintas como Alchemy Factory',e:'sust',inc:'Bocas estándar en todas las máquinas a la altura exacta de la cinta, con un tramo de rodillos que asoma; los objetos se ven entrar por la boca y salir por la bandeja; objetos tumbados y más juntos en la cinta',hc:'Edu aprueba GIF',dep:'',ver:'Sustituida por el rediseño R (10-nov). Hecho, esperando a Edu: bocas estándar (comun.boca_cinta) en todas las máquinas a 0,30 m, con rodillos que asoman; los objetos entran por la boca y salen por la bandeja; tumbados y más juntos en la cinta',c:'53bf303'},
 {id:'V1.20',n:'Pacientes que entran por la puerta',e:'hecho',inc:'Cada paciente es una persona que entra por la puerta, va a su asiento o a la cola, y de ahí a la camilla o la cápsula; nadie aparece de la nada',hc:'GIF',dep:'',ver:'Hecho: GestorPacientes mueve a las mismas personas puerta → asiento/cola → camilla o cápsula → puerta; ya no se crea gente en su sitio. Se ve en extraccion2.gif',c:'53bf303'},
 {id:'V1.12',n:'Publicar 1.0',e:'sust',inc:'',hc:'Edu da el aprobado',dep:'V1.11',ver:'Sustituida por el rediseño R (10-nov). Builds de Windows y web en entregas (p417, tercera prueba). Material de itch listo: portada 630×500, banner, 6 capturas, textos ES/EN, declaración de IA y pasos (docs/publicar). Lista de pasos de Steam (30 días desde el pago, «Próximamente» 2 semanas). Falta que Edu lo suba y dé el aprobado',c:''}]},
{f:'Rediseño · Two Point Hospital + Alchemy Factory (10-nov)',t:[
 {id:'R0.1',n:'Científico pillado al sacar sangre (de verdad)',e:'hecho',inc:'La postura de extraer no se aplicaba en partida: la simulación reinicia «trabajando» antes de decidir la postura',hc:'Fotogramas de la partida real con el científico inclinado y trabajando',dep:'—',ver:'Causa en bugs.md (B11). Verificado con fotogramas de --prueba_raton --seq_camilla, no con la demo',c:'22cfd2b'},
 {id:'R0.2',n:'Análisis de Two Point Hospital y Alchemy Factory',e:'hecho',inc:'Capturas de Steam (TPH, Campus, Museum, Alchemy Factory) y análisis: de Two Point el hub, salas, construcción, aspecto de máquinas e interfaz; de Alchemy Factory la automatización; de Factorio lo que AF no resuelva. 10 rasgos medibles nuevos',hc:'docs/referencias/two_point_alchemy.md con capturas y rasgos; Edu lo ve',dep:'R0.1',ver:'docs/referencias/two_point_alchemy.md y lámina lamina_two_point_alchemy.jpg con 23 capturas de Steam analizadas (Two Point Hospital, Campus, Museum, Alchemy Factory); 10 rasgos medibles nuevos',c:'3206899'},
 {id:'R0.3',n:'Diseño del rediseño',e:'hecho',inc:'Revisión del documento de diseño: vista de director sin científico propio (personal contratado que trabaja a mano hasta automatizar), todo mezclado (máquinas y cintas dentro de salas Two Point; cintas que cruzan pasillos y paredes por pasamuros), qué va por cinta y qué por tubería, bocas fijas con tolva, divisores al cruzar, cajas colchón, velocidades que cuadran, salas y sus objetos obligatorios, flujo de pacientes, economía',hc:'Edu aprueba el documento (puerta 2 bis)',dep:'R0.2',ver:'Escrito, esperando a Edu: sección «Rediseño 2.0» en docs/diseno.md y en el documento de diseño vivo (salas y su personal, logística con envases reales, bocas fijas, pasamuros y paso bajo suelo, cadena con sentido)',c:'2877c2e'},
 {id:'R1.1',n:'Pack de personajes CC0 caricaturesco',e:'hecho',inc:'Buscar packs libres más parecidos a Two Point (cabeza grande, proporciones exageradas, animaciones de andar/sentarse/trabajar), lámina con la cámara del juego al lado de Two Point',hc:'Edu elige pack en la lámina',dep:'R0.2',ver:'Edu eligió A (Quaternius, con batas y zombis) + animaciones de C (KayKit) + zombis de B. 17 personajes con 37 animaciones cada uno (andar, sentarse, tumbarse, trabajar, sostener, interactuar…) pasadas con tools/blender/retarget_kaykit.py; lámina docs/capturas/r11_lamina_personajes.jpg',c:'7a6714d'},
 {id:'R1.2',n:'Lámina de estilo Two Point',e:'hecho',inc:'Una sala con paredes gruesas y franjas de color recortadas, puerta y ventana, una máquina rediseñada (centrífuga redondeada y exagerada), un tramo de cinta Alchemy Factory con tolva y una tubería, a la cámara del juego y al lado de las referencias',hc:'Edu aprueba la lámina',dep:'R1.1',ver:'Aprobada por Edu el 10-nov («ok») con paredes de 1,0 m. docs/capturas/r12_paredes_altas.jpg',c:''},
 {id:'R1.2b',n:'Calidad de imagen al nivel de Two Point',e:'hecho',inc:'Antialiasing (MSAA 4× + TAA), sombras suaves de alta resolución, SSAO sin grano, materiales con textura (degradado, desgaste, relieve), más segmentos en curvas y biseles, texturas de banda y suelo con relieve',hc:'Recorte al 300 % sin escalones ni grano; Edu: «ya no parece 240p»',dep:'R1.2',ver:'Aprobada por Edu el 10-nov: MSAA 4×, supermuestreo, sombras suaves de alta resolución, SSAO/SSIL, relieve en superficies. docs/capturas/r12b_calidad.jpg',c:''},
 {id:'R1.2c',n:'Centrífuga de paso: la cinta atraviesa la máquina',e:'hecho',inc:'Como en Alchemy Factory: la gradilla entra por un agujero de la máquina, se ve dentro (rodillos y ventana), un elevador la sube al tambor, gira, unas agujas sacan el plasma a la tubería y la misma gradilla, ya solo con hematíes, sale por el agujero del otro lado a la cinta de salida. Cinta de entrada, túnel y cinta de salida en la misma línea y altura',hc:'GIF del recorrido completo; Edu: «ahora sí entra y sale de la máquina»',dep:'R1.2',ver:'Aprobada por Edu el 10-nov: la cinta atraviesa la centrífuga. docs/capturas/r12c_centrifuga_paso.gif',c:''},
 {id:'R1.3',n:'Pantalla objetivo nueva',e:'hecho',inc:'Montada en Godot con la cámara real: recepción, sala de espera, sala de extracción, sala de centrífugas unida por cinta y tubería que cruza la pared, personal y pacientes del pack elegido, interfaz estilo Two Point (menú redondo abajo a la izquierda, dinero y velocidad abajo a la derecha, objetivos arriba a la derecha, ficha con pestañas)',hc:'Edu da el «aprobado» (puerta 3)',dep:'R1.2',ver:'Puerta 3 aprobada por Edu el 10-nov con la condición de que nada se atraviese: puntos de uso de banco y taburete medidos con la animación, reposabrazos, comprobación de solapes con 0 solapes. docs/referencias/objetivo_2.png',c:''},
 {id:'R2.1',n:'Construcción de salas Two Point',e:'curso',inc:'Arrastrar el plano, paredes con puerta y ventanas, objetos obligatorios con aviso, huellas de acceso, validar, editar, vender; objetos de pasillo',hc:'Prueba con ratón real: construir, editar y vender una sala',dep:'R1.3',ver:'Empezando: construcción de salas en el juego',c:''},
 {id:'R2.2',n:'Vista de director',e:'',inc:'Cámara Two Point (giro en pasos de 90°, zoom, paredes que se recortan), selección de salas, personas y máquinas con su ficha',hc:'Prueba con ratón real',dep:'R1.3',ver:'',c:''},
 {id:'R2.3',n:'Personal',e:'',inc:'Contratar científicos, becarios y conserjes; asignar a sala; trabajan a mano (llevar tubos, cargar máquinas) hasta que hay cintas; zombis como personal tras liberar el virus',hc:'Bot: una partida sin automatizar funciona solo con personal',dep:'R2.1, R2.2',ver:'',c:''},
 {id:'R2.4',n:'Pacientes',e:'',inc:'Llegan a recepción, esperan sentados, van a la sala que les toca, se van; colas por sala visibles en la ficha',hc:'GIF de una tanda de pacientes de puerta a puerta',dep:'R2.1',ver:'',c:''},
 {id:'R2.5',n:'Logística con sentido (Alchemy Factory)',e:'',inc:'Cintas anchas con patas y objetos grandes en fila; bocas fijas por máquina con tolva y stock visible; divisor/unificador al cruzar; pasamuros para cruzar paredes; tuberías para líquidos; cajas colchón; velocidades que cuadran con las máquinas',hc:'GIF de una línea completa; bot sin atascos; Edu: «ahora tiene sentido»',dep:'R2.1',ver:'',c:''},
 {id:'R2.6',n:'Máquinas rehechas en estilo Two Point',e:'',inc:'Todas las máquinas con bocas fijas que se entienden, partes que se mueven con sentido y la persona interactuando; pieza a pieza con lámina',hc:'Edu aprueba cada lámina',dep:'R1.2, R2.5',ver:'',c:''},
 {id:'R2.7',n:'Interfaz estilo Two Point',e:'',inc:'Menú redondo abajo a la izquierda (Salas, Objetos, Contratar, Info), dinero, reputación y velocidad abajo a la derecha, objetivos arriba a la derecha, fichas con pestañas y botones de acción, catálogos con miniaturas',hc:'Edu aprueba la captura',dep:'R1.3',ver:'',c:''},

{f:'Puerta 5 · Trozo vertical (apuntado)',t:[
